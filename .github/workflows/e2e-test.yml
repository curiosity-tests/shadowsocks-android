name: E2E Test
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: instrumented
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""

permissions:
  contents: read
  id-token: write

env:
  # The one variable that separates the arms: on baseline, action-checkout
  # skips its Set up Chalk step entirely.
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}

run-name: "E2E Test ${{ inputs.leg || 'push' }} ${{ inputs.racecar_run }}"

jobs:
  e2e-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: crashappsec/action-checkout@e9ff46a65f6403d9d88b87d248c3dfa41550ec75
        with:
          chalk: ${{ env.CHALK_ON }}
          profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
          observables_continue_on_error: false
          lfs: false
          submodules: recursive
      - name: Assert instrumentation is live
        if: env.CHALK_ON == 'true'
        run: |
          test -n "${CURIOSITY_ROOT:-}" || { echo "::error::CURIOSITY_ROOT unset - observables never installed"; exit 1; }
          test -S "${CURIOSITY_SOCKET_NAME:?socket name unset}" || { echo "::error::co-hostd socket absent"; exit 1; }

      - uses: actions/setup-java@v4
        with:
          distribution: jetbrains
          java-version: 21
        env:
          # The jetbrains distribution pages through
          # api.github.com/repos/JetBrains/JetBrainsRuntime/releases to resolve a version, and
          # it only authenticates from $GITHUB_TOKEN - it ignores setup-java's own `token`
          # input (src/distributions/jetbrains/installer.ts). Unauthenticated, those dozens of
          # calls per job hit the hosted runner's shared-IP limit: "API rate limit exceeded for
          # 52.176.124.224", which fails this step before anything is built.
          GITHUB_TOKEN: ${{ github.token }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}

      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/src/main/rust/shadowsocks-rust/target
          key: cargo-${{ hashFiles('core/src/main/rust/shadowsocks-rust/Cargo.lock') }}

      - name: Build debug APK (x86_64)
        run: ./gradlew assembleDebug -PCARGO_PROFILE=debug -PTARGET_ABI=x86_64

      - name: Build ssserver
        run: |
          cd core/src/main/rust/shadowsocks-rust
          cargo build --release --bin ssserver --features "server,aead-cipher,logging"

      - name: E2E Test
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: true
          emulator-options: >-
            -no-snapshot-save -no-window -gpu swiftshader_indirect
            -noaudio -no-boot-anim
          disable-animations: true
          script: bash test-e2e.sh
        env:
          SKIP_EMULATOR_BOOT: "true"
          ADB: adb
          APK: ${{ github.workspace }}/mobile/build/outputs/apk/debug/mobile-x86_64-debug.apk
          SSSERVER: ${{ github.workspace }}/core/src/main/rust/shadowsocks-rust/target/release/ssserver

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: screen_*.png
